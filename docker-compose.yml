services:
  db:
    image: pgvector/pgvector:pg16
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    working_dir: /app
    command: alembic -c /app/alembic.ini upgrade head
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    working_dir: /app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      AGENT_SERVER_URL: http://agent-server:2024
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: on-failure

  mcp:
    build:
      context: .
      dockerfile: backend/Dockerfile
    working_dir: /app
    command: python -m app.mcp.server
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: on-failure

  agent-server:
    build:
      context: .
      dockerfile: backend/Dockerfile
    working_dir: /app
    command: langgraph dev --config /app/langgraph.json --host 0.0.0.0 --port 2024 --no-browser --allow-blocking --n-jobs-per-worker 10
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MCP_SERVER_URL: http://mcp:8001/mcp
      ANTI_PILOT_BUILD_MODULE_GRAPHS: "1"
    depends_on:
      backend:
        condition: service_started
      mcp:
        condition: service_started
    restart: on-failure

volumes:
  postgres_data:
